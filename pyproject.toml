[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgesdlc"
version = "0.1.0"
description = "Evidence-first A/B/C software delivery demonstration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
graph = ["langgraph>=1,<2"]

[project.scripts]
forgesdlc = "forgesdlc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forgesdlc*"]

[tool.setuptools.package-data]
forgesdlc = ["fixtures/*.json", "fixtures/*.py", "web/*.html"]

